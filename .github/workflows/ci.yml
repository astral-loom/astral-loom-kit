name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm run test

  malware-and-security-scan:
    name: Malware & Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Scan Repository for Malware (ClamAV)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clamav clamav-daemon
        sudo systemctl stop clamav-freshclam || true
        sudo freshclam --quiet || true
        if [ -d /var/lib/clamav ] && [ "$(ls -A /var/lib/clamav 2>/dev/null)" ]; then
          clamscan -r --infected --exclude-dir="^./node_modules" --exclude-dir="^./.git" .
        else
          echo "ClamAV signature database unavailable, skipping file scan."
        fi

    - name: Scan Dependencies for Critical Vulnerabilities & Malware
      run: |
        npm audit --audit-level=critical || true

    - name: Scan for Leaked Secrets & Keys (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Dependency Review (PRs)
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@v4
