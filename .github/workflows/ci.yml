name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm run test

  malware-and-security-scan:
    name: Malware & Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Scan Repository for Malware (ClamAV)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clamav
        sudo freshclam --quiet || true
        clamscan -r --infected --exclude-dir="^./node_modules" .
    - name: Scan for Secret & Key Leaks (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Dependency Review (PRs)
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@v4
